version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: podgen-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TTS_ENGINE=${TTS_ENGINE:-gtts}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_HOST_VOICE=${ELEVENLABS_HOST_VOICE:-21m00Tcm4TlvDq8ikWAM}
      - ELEVENLABS_GUEST_VOICE=${ELEVENLABS_GUEST_VOICE:-AZnzlk1XvdvUeBnXmlld}
    volumes:
      - ./audio_output:/app/audio_output
      - ./vector_store:/app/vector_store
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: podgen-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  audio_output:
  vector_store:
  data:
